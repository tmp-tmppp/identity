{{- if .Values.networkPolicy.enabled }}
# The gateway (logins in the browser), the gateway's token check (oauth2-proxy fetches the signing keys) and the services
# of the same namespace (signing keys, service tokens and the tenants service's admin calls) may reach the HTTP port;
# the management port (health, and /metrics for Prometheus) only from the monitoring namespace: no Pod of this namespace
# uses it (the kubelet probes it from the node).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "identity.fullname" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "identity.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayPodLabels | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.tokenCheckPodLabels | nindent 14 }}
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metrics.namespace | quote }}
      ports:
        - port: management
          protocol: TCP
{{- end }}
