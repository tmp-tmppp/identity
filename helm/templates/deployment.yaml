apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identity.fullname" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # One Keycloak with a local cache: never two at once during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "identity.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "identity.selectorLabels" . | nindent 8 }}
      annotations:
        # Prometheus scrapes the metrics of Keycloak (KC_METRICS_ENABLED, built into the image) on the management port,
        # at the Pod address: the Service does not expose that port (REQ-20; the port is fixed in the image).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /metrics
        # A changed ConfigMap restarts the Pod (it reads the environment only when it starts).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          # The Secret stays after the ConfigMap: for a name in both, the last source wins (the real PLATFORM_ADMIN_EMAIL
          # is only in the Secret; the ConfigMap holds that key empty).
          envFrom:
            - configMapRef:
                name: {{ include "identity.fullname" . }}
            - secretRef:
                name: {{ .Values.existingSecret }}
                optional: true
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: management
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: management
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: management
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "identity.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: keycloak-tmp
              mountPath: /opt/keycloak/data/tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: keycloak-tmp
          emptyDir:
            sizeLimit: 64Mi
