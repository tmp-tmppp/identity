# "helm test" after every deploy: the realm "chance" was imported and Keycloak serves it (its OpenID Connect discovery
# answers through the Service, which lists ready Pods only). The management port is not in the Service, so health is
# the kubelet's probe, not this test. A failure makes the pipeline roll the release back (ADR-048).
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "identity.fullname" . }}-smoke-test
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke-test
      image: {{ .Values.smokeTest.image }}
      command:
        - sh
        - -c
        - >-
          wget -q -T 5 -O - "http://{{ include "identity.fullname" . }}:{{ .Values.service.port }}/realms/chance/.well-known/openid-configuration" > /dev/null
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        {{- include "identity.containerSecurityContext" . | nindent 8 }}
